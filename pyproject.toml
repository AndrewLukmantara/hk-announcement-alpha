[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hkalpha"
version = "0.1.0"
description = "Bilingual LLM announcement signals x Southbound Stock Connect flows on HKEX equities"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.1", "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14",
  "matplotlib>=3.8", "pyyaml>=6", "pyarrow>=14", "requests>=2.31",
  "beautifulsoup4>=4.12", "lxml>=5",
]

[project.optional-dependencies]
live = ["yfinance>=0.2.40", "pypdf>=4"]
dev = ["pytest>=8"]

[project.scripts]
hkalpha = "hkalpha.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
